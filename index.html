<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת דוח 1 - מילואים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- הוספת ספרייה לקריאת קבצי אקסל מרובי-לשוניות -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Rubik', sans-serif; background-color: #f3f4f6; }
        
        /* Custom scrollbar for table */
        .table-container::-webkit-scrollbar { height: 8px; width: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #6b7280; }
        .tab-inactive:hover { color: #374151; border-bottom: 3px solid #d1d5db; }
        
        /* Checkbox custom style */
        input[type="checkbox"] { accent-color: #2563eb; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:flex sm:items-center sm:justify-between">
            <div class="flex items-center gap-3 mb-4 sm:mb-0">
                <button id="back-to-home-btn" onclick="goHome()" class="hidden text-blue-200 hover:text-white transition bg-blue-800/50 hover:bg-blue-800 p-2 rounded-lg ml-2" title="חזור לתפריט הראשי">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                <i class="fa-solid fa-clipboard-user text-3xl text-blue-300"></i>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">מערכת דוח 1</h1>
                    <p class="text-blue-200 text-sm" id="connection-status">מתחבר לשרת...</p>
                </div>
            </div>
            
            <div class="flex items-center bg-blue-800 rounded-lg p-2 shadow-inner">
                <i class="fa-regular fa-calendar-days ml-3 text-blue-200"></i>
                <input type="date" id="date-picker" class="bg-transparent text-white border-none focus:ring-0 cursor-pointer font-medium outline-none">
            </div>
        </div>
    </header>

    <div class="flex-grow flex flex-col w-full">
        <!-- Home View (Landing Page) -->
        <div id="home-view" class="max-w-5xl mx-auto w-full px-4 py-12 flex-grow flex flex-col items-center justify-center animate-fade-in">
            <div class="text-center mb-10">
                <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-3">ברוכים הבאים למערכת הדיווח</h2>
                <p class="text-gray-500 text-lg">אנא בחר את המחלקה שלך כדי להתחיל בדיווח נוכחות</p>
            </div>
            
            <div id="departments-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 w-full max-w-4xl">
                <!-- Department buttons will be injected here -->
                <div class="p-8 text-center text-gray-500 bg-white rounded-xl shadow-sm border border-gray-100 col-span-full">
                    טוען נתונים...
                </div>
            </div>
        </div>

        <!-- Main App View (Table & Actions) -->
        <main id="main-app-view" class="hidden flex-grow max-w-7xl mx-auto w-full px-4 py-6 flex-col">
            
            <!-- Action Buttons Row -->
            <div class="flex flex-wrap gap-3 justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6">

            <div class="flex flex-wrap gap-2 mt-2 sm:mt-0">
                <!-- Export to Excel/CSV -->
                <button onclick="exportToCSV()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition text-sm font-medium flex items-center gap-2 border border-gray-300">
                    <i class="fa-solid fa-file-csv"></i>
                    <span class="hidden sm:inline">ייצוא נתונים</span>
                </button>
                
                <!-- WhatsApp Summary -->
                <button onclick="copySummary()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg shadow transition text-sm font-medium flex items-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>העתק דיווח לוואטסאפ</span>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex-grow flex flex-col overflow-hidden">
            <!-- Tabs & Search Navigation -->
            <div class="border-b border-gray-200 bg-gray-50/50 flex flex-col sm:flex-row justify-between items-start sm:items-center p-2 gap-3">
                <!-- Tabs Navigation -->
                <nav class="flex gap-2 px-2 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0 hide-scrollbar" id="tabs-container" aria-label="Tabs">
                    <!-- Tabs will be injected here -->
                    <button class="tab-active px-4 py-2 rounded-t-lg transition whitespace-nowrap">מעלים...</button>
                </nav>

                <!-- Search Bar -->
                <div class="relative w-full sm:w-72 shrink-0 px-2 sm:px-0">
                    <i class="fa-solid fa-magnifying-glass absolute right-5 sm:right-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="search-input" oninput="handleSearch(event)" placeholder="חיפוש לפי שם, טלפון, מספר אישי..." class="w-full pr-10 pl-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm text-sm bg-white">
                </div>
            </div>

            <!-- Table -->
            <div class="flex-grow overflow-auto table-container relative">
                <table class="w-full text-right border-collapse min-w-[800px]">
                    <thead class="bg-gray-50 text-gray-600 sticky top-0 z-10 shadow-sm text-sm">
                        <tr>
                            <th class="p-3 font-semibold w-12 text-center">#</th>
                            <th class="p-3 font-semibold">שם החייל</th>
                            <th class="p-3 font-semibold w-56 text-center">סטטוס יומי</th>
                            <th class="p-3 font-semibold">תפקיד</th>
                            <th class="p-3 font-semibold">טלפון</th>
                            <th class="p-3 font-semibold">מספר אישי</th>
                            <th class="p-3 font-semibold w-20 text-center">פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="soldiers-table-body" class="divide-y divide-gray-100 bg-white text-sm">
                        <tr><td colspan="7" class="p-8 text-center text-gray-500">טוען נתונים מהשרת...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Summary Footer -->
            <div class="bg-gray-50 p-4 border-t border-gray-200 flex justify-between items-center text-sm">
                <span class="text-gray-600">מציג: <strong id="total-count" class="text-gray-900">0</strong> חיילים</span>
                <span class="text-gray-600">דווחו היום מתוכם: <strong id="reported-count" class="text-blue-600">0</strong></span>
            </div>
        </div>
    </main>

    <!-- Add/Edit Soldier Modal -->
    <div id="add-soldier-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 transform transition-all max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-5">
                <h3 id="modal-title" class="text-xl font-bold text-gray-800">הוספת חייל למצבת</h3>
                <button onclick="closeAddSoldierModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="add-soldier-form" onsubmit="submitSoldierForm(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">שם מלא *</label>
                    <input type="text" id="new-soldier-name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4 flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-gray-700 text-sm font-bold mb-2">מספר אישי</label>
                        <input type="text" id="new-soldier-id" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-gray-700 text-sm font-bold mb-2">טלפון</label>
                        <input type="text" id="new-soldier-phone" dir="ltr" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-right focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">תפקיד</label>
                    <input type="text" id="new-soldier-role" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="למשל: נהג, חובש, מ''פ...">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">מחלקה (לשונית) *</label>
                    <input type="text" id="new-soldier-dept" required list="dept-options" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="למשל: מפלג, אספקה...">
                    <datalist id="dept-options">
                        <!-- Options generated dynamically -->
                    </datalist>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeAddSoldierModal()" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition">ביטול</button>
                    <button type="submit" id="modal-submit-btn" class="px-4 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition shadow-md">שמור חייל</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-info"></i>
        <span id="toast-msg">הודעה</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, setDoc, deleteDoc, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        let db;
        let auth;
        let currentUser = null;
        let soldiers = [];
        let dailyStatusMap = {};
        let departments = new Set(["הכל", "מפלג", "אספקה"]);
        let activeTab = "הכל";
        let searchQuery = "";
        let currentWorkbook = null; 
        let currentEditSoldierId = null; 
        
        let unsubSoldiers = null;
        let unsubDaily = null;

        // Expanded Statuses
        const STATUS_OPTIONS = [
            { val: "לא דווח", color: "text-gray-500 bg-gray-100 border-gray-200", emoji: "⚪" },
            { val: "נוכח", color: "text-green-800 bg-green-100 border-green-200", emoji: "🟢" },
            { val: "אחרי משמרת", color: "text-yellow-800 bg-yellow-100 border-yellow-200", emoji: "🟡" },
            { val: "חופשה", color: "text-blue-800 bg-blue-100 border-blue-200", emoji: "🔵" },
            { val: "הגנש", color: "text-orange-800 bg-orange-100 border-orange-200", emoji: "🟠" },
            { val: "רם 2", color: "text-red-800 bg-red-100 border-red-200", emoji: "🏥" },
            { val: "גימלים", color: "text-red-900 bg-red-200 border-red-300", emoji: "🤒" },
            { val: "אבטש", color: "text-purple-800 bg-purple-100 border-purple-200", emoji: "🛡️" },
            { val: "השתחרר", color: "text-teal-800 bg-teal-100 border-teal-200", emoji: "✌️" },
            { val: "בבית", color: "text-gray-700 bg-gray-200 border-gray-300", emoji: "🏠" },
            { val: "עריץ/נפקד", color: "text-pink-800 bg-pink-100 border-pink-200", emoji: "❌" }
        ];

        async function init() {
            try {
                const firebaseConfig = {
                    apiKey: "AIzaSyCxBF1xT5n5SPR62GWkDdMerrp3QSRKQ-g",
                    authDomain: "doh1-1cdde.firebaseapp.com",
                    databaseURL: "https://doh1-1cdde-default-rtdb.europe-west1.firebasedatabase.app",
                    projectId: "doh1-1cdde",
                    storageBucket: "doh1-1cdde.firebasestorage.app",
                    messagingSenderId: "653604638082",
                    appId: "1:653604638082:web:73c5f6588780122cf8539b",
                    measurementId: "G-9LL5BM6BYN"
                };
                
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                const userCredential = await signInAnonymously(auth);
                currentUser = userCredential.user;
                document.getElementById('connection-status').innerHTML = '<i class="fa-solid fa-circle text-green-400 text-xs"></i>   מוצפן מחובר לענן';

                const dateInput = document.getElementById('date-picker');
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                dateInput.value = `${yyyy}-${mm}-${dd}`;
                
                dateInput.addEventListener('change', handleDateChange);
                setupMidnightRefresh();
                startDataListeners();

            } catch (err) {
                console.error("Initialization error:", err);
                document.getElementById('connection-status').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400"></i> שגיאת חיבור`;
                showToast("שגיאה בהתחברות לשרת.", true);
            }
        }

        function setupMidnightRefresh() {
            const now = new Date();
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);
            const msUntilMidnight = tomorrow - now;
            setTimeout(() => { window.location.reload(); }, msUntilMidnight);
        }

        function startDataListeners() {
            if (!currentUser) return;
            const soldiersRef = collection(db, 'soldiers_roster');
            
            if (unsubSoldiers) unsubSoldiers();
            unsubSoldiers = onSnapshot(soldiersRef, (snapshot) => {
                soldiers = [];
                departments = new Set(["הכל"]);
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    soldiers.push({ id: doc.id, ...data });
                    if (data.department) {
                        departments.add(data.department);
                    }
                });
                
                soldiers.sort((a, b) => a.name.localeCompare(b.name, 'he'));
                
                renderHomeView(); // Update landing page buttons
                updateTabsUI();
                updateDatalist();
                renderTable();
            });

            listenToDailyStatus();
        }

        function listenToDailyStatus() {
            const dateStr = document.getElementById('date-picker').value;
            if (!dateStr || !currentUser) return;

            const dailyRef = collection(db, `daily_status/${dateStr}/statuses`);
            
            if (unsubDaily) unsubDaily();
            unsubDaily = onSnapshot(dailyRef, (snapshot) => {
                dailyStatusMap = {};
                snapshot.forEach(doc => {
                    dailyStatusMap[doc.id] = doc.data().status;
                });
                renderTable();
                renderHomeView(); // Update the dashboard cards in real time
            });
        }

        function handleDateChange() {
            listenToDailyStatus();
        }
        
        window.handleSearch = (event) => {
            searchQuery = event.target.value.trim().toLowerCase();
            renderTable();
        };

        // --- Navigation Functions (Home vs Main) ---
        
        function renderHomeView() {
            const grid = document.getElementById('departments-grid');
            grid.innerHTML = '';
            
            let deptsArray = Array.from(departments);
            deptsArray = deptsArray.filter(d => d !== "הכל").sort();

            // Render specific departments first
            deptsArray.forEach(dept => {
                const deptSoldiers = soldiers.filter(s => s.department === dept);
                const count = deptSoldiers.length;
                
                let reported = 0;
                let present = 0;
                
                deptSoldiers.forEach(s => {
                    const stat = dailyStatusMap[s.id] || "לא דווח";
                    if (stat !== "לא דווח") reported++;
                    if (stat === "נוכח") present++;
                });

                const btn = document.createElement('button');
                btn.className = "bg-white hover:bg-blue-50 border border-gray-200 hover:border-blue-300 p-5 rounded-2xl shadow-sm hover:shadow-md transition-all flex flex-col items-center justify-center gap-3 text-gray-800 group w-full";
                btn.onclick = () => goToDepartment(dept);
                
                btn.innerHTML = `
                    <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <div class="text-center w-full mt-1">
                        <h3 class="font-bold text-xl mb-3">${escapeHTML(dept)}</h3>
                        <div class="grid grid-cols-3 gap-1 bg-gray-50 p-2 rounded-xl text-sm border border-gray-100 group-hover:bg-white group-hover:border-blue-200 transition-colors w-full">
                            <div class="flex flex-col">
                                <span class="text-gray-500 text-[10px] sm:text-xs font-medium">במצבת</span>
                                <span class="font-bold text-gray-800">${count}</span>
                            </div>
                            <div class="flex flex-col border-r border-gray-200">
                                <span class="text-gray-500 text-[10px] sm:text-xs font-medium">דווחו</span>
                                <span class="font-bold ${reported === count && count > 0 ? 'text-green-600' : 'text-blue-600'}">${reported}/${count}</span>
                            </div>
                            <div class="flex flex-col border-r border-gray-200">
                                <span class="text-gray-500 text-[10px] sm:text-xs font-medium">נוכחים</span>
                                <span class="font-bold text-green-600">${present}</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(btn);
            });

            // Always add "הכל" (All / Admin) button at the end with full stats
            let totalReported = 0;
            let totalPresent = 0;
            soldiers.forEach(s => {
                const stat = dailyStatusMap[s.id] || "לא דווח";
                if (stat !== "לא דווח") totalReported++;
                if (stat === "נוכח") totalPresent++;
            });

            const allBtn = document.createElement('button');
            allBtn.className = "bg-gradient-to-br from-blue-800 to-blue-900 hover:from-blue-700 hover:to-blue-800 p-5 rounded-2xl shadow-md hover:shadow-lg transition-all flex flex-col items-center justify-center gap-3 text-white group sm:col-span-2 md:col-span-1 w-full";
            allBtn.onclick = () => goToDepartment("הכל");
            
            allBtn.innerHTML = `
                <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-building-shield"></i>
                </div>
                <div class="text-center w-full mt-1">
                    <h3 class="font-bold text-xl mb-3">כלל הפלוגה / ניהול</h3>
                    <div class="grid grid-cols-3 gap-1 bg-white/10 p-2 rounded-xl text-sm border border-white/20 w-full">
                        <div class="flex flex-col">
                            <span class="text-blue-200 text-[10px] sm:text-xs font-medium">במצבת</span>
                            <span class="font-bold">${soldiers.length}</span>
                        </div>
                        <div class="flex flex-col border-r border-white/20">
                            <span class="text-blue-200 text-[10px] sm:text-xs font-medium">דווחו</span>
                            <span class="font-bold ${totalReported === soldiers.length && soldiers.length > 0 ? 'text-green-300' : 'text-white'}">${totalReported}/${soldiers.length}</span>
                        </div>
                        <div class="flex flex-col border-r border-white/20">
                            <span class="text-blue-200 text-[10px] sm:text-xs font-medium">נוכחים</span>
                            <span class="font-bold text-green-400">${totalPresent}</span>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(allBtn);
        }

        window.goToDepartment = (dept) => {
            activeTab = dept;
            
            // UI Toggle
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('main-app-view').classList.remove('hidden');
            document.getElementById('main-app-view').classList.add('flex');
            document.getElementById('back-to-home-btn').classList.remove('hidden');
            
            // Reset search and refresh
            searchQuery = "";
            document.getElementById('search-input').value = "";
            updateTabsUI();
            renderTable();
            window.scrollTo(0, 0);
        };

        window.goHome = () => {
            document.getElementById('main-app-view').classList.add('hidden');
            document.getElementById('main-app-view').classList.remove('flex');
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('back-to-home-btn').classList.add('hidden');
        };

        function updateTabsUI() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            
            let deptsArray = Array.from(departments);
            deptsArray = deptsArray.filter(d => d !== "הכל").sort();
            deptsArray.unshift("הכל");

            if (!deptsArray.includes(activeTab)) {
                activeTab = "הכל";
            }

            deptsArray.forEach(dept => {
                const btn = document.createElement('button');
                btn.textContent = dept;
                
                const count = dept === "הכל" ? soldiers.length : soldiers.filter(s => s.department === dept).length;
                
                btn.className = `px-4 py-2 rounded-t-lg transition whitespace-nowrap text-sm sm:text-base flex gap-2 items-center ${activeTab === dept ? 'tab-active bg-white' : 'tab-inactive bg-gray-50/50 hover:bg-gray-100'}`;
                
                const badge = document.createElement('span');
                badge.className = `text-xs px-2 py-0.5 rounded-full ${activeTab === dept ? 'bg-blue-100 text-blue-700' : 'bg-gray-200 text-gray-600'}`;
                badge.textContent = count;
                btn.appendChild(badge);

                btn.onclick = () => {
                    activeTab = dept;
                    updateTabsUI();
                    renderTable();
                };
                container.appendChild(btn);
            });
        }

        function updateDatalist() {
            const datalist = document.getElementById('dept-options');
            datalist.innerHTML = '';
            departments.forEach(dept => {
                if (dept !== "הכל") {
                    const opt = document.createElement('option');
                    opt.value = dept;
                    datalist.appendChild(opt);
                }
            });
        }

        function renderTable() {
            const tbody = document.getElementById('soldiers-table-body');
            tbody.innerHTML = '';

            // Step 1: Filter by Department
            let filteredSoldiers = activeTab === "הכל" 
                ? soldiers 
                : soldiers.filter(s => s.department === activeTab);

            // Step 2: Filter by Search Query
            if (searchQuery) {
                filteredSoldiers = filteredSoldiers.filter(s => {
                    const name = s.name ? s.name.toLowerCase() : "";
                    const pid = s.personalId ? s.personalId : "";
                    const phone = s.phone ? s.phone : "";
                    
                    return name.includes(searchQuery) || 
                           pid.includes(searchQuery) || 
                           phone.includes(searchQuery);
                });
            }

            let reportedCount = 0;

            if (filteredSoldiers.length === 0) {
                if (searchQuery) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-500 bg-gray-50 border-b border-gray-100">לא נמצאו תוצאות לחיפוש "${escapeHTML(searchQuery)}"</td></tr>`;
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-500 bg-gray-50 border-b border-gray-100">אין חיילים במחלקה זו.</td></tr>`;
                }
            } else {
                filteredSoldiers.forEach((soldier, index) => {
                    const currentStatus = dailyStatusMap[soldier.id] || "לא דווח";
                    if (currentStatus !== "לא דווח") reportedCount++;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-blue-50/50 transition border-b border-gray-100";
                    
                    const activeOpt = STATUS_OPTIONS.find(o => o.val === currentStatus) || STATUS_OPTIONS[0];
                    
                    // כפתור ה-V המהיר והרשימה הנפתחת צמודים יחד
                    let statusCellHtml = `
                        <div class="flex items-center gap-2 justify-center">
                            <!-- כפתור V מהיר -->
                            <button onclick="updateStatus('${soldier.id}', 'נוכח')" 
                                    class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition-all duration-200 border shadow-sm focus:outline-none 
                                    ${currentStatus === 'נוכח' ? 'bg-green-500 text-white border-green-600 ring-2 ring-green-200/50' : 'bg-white text-gray-300 border-gray-200 hover:bg-green-50 hover:text-green-500 hover:border-green-300'}" 
                                    title="סמן כנוכח">
                                <i class="fa-solid fa-check text-lg"></i>
                            </button>
                            
                            <!-- בחירת סיבת היעדרות / סטטוס אחר -->
                            <select onchange="updateStatus('${soldier.id}', this.value)" 
                                    class="w-full min-w-[120px] p-2 border rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 text-sm appearance-none cursor-pointer text-center outline-none transition ${activeOpt.color}">
                    `;
                    
                    STATUS_OPTIONS.forEach(opt => {
                        const isSelected = opt.val === currentStatus ? 'selected' : '';
                        statusCellHtml += `<option value="${opt.val}" ${isSelected}>${opt.emoji} ${opt.val}</option>`;
                    });
                    statusCellHtml += `</select></div>`;

                    // Handling values
                    const pId = soldier.personalId || '-';
                    const phone = soldier.phone || '-';
                    const role = soldier.role || '-';

                    // הזרקת השורה עם הסדר החדש של העמודות
                    tr.innerHTML = `
                        <td class="p-3 text-center text-gray-400 font-medium">${index + 1}</td>
                        <td class="p-3 font-medium text-gray-900 whitespace-nowrap">${escapeHTML(soldier.name)}</td>
                        <td class="p-3">${statusCellHtml}</td>
                        <td class="p-3 text-gray-600"><span class="bg-gray-100 text-gray-700 px-2 py-1 rounded text-xs whitespace-nowrap">${escapeHTML(role)}</span></td>
                        <td class="p-3 text-gray-600" dir="ltr" style="text-align: right;">${escapeHTML(phone)}</td>
                        <td class="p-3 text-gray-600 whitespace-nowrap">${escapeHTML(pId)}</td>
                        <td class="p-3 text-center">
                            <div class="flex justify-center gap-1">
                                <button onclick="openEditSoldierModal('${soldier.id}')" class="text-blue-400 hover:text-blue-600 hover:bg-blue-50 p-2 rounded transition" title="ערוך חייל">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button onclick="confirmDelete('${soldier.id}', '${escapeHTML(soldier.name).replace(/'/g, "\\'")}')" class="text-red-400 hover:text-red-600 hover:bg-red-50 p-2 rounded transition" title="מחק חייל">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('total-count').textContent = filteredSoldiers.length;
            document.getElementById('reported-count').textContent = `${reportedCount} / ${filteredSoldiers.length}`;
        }

        window.updateStatus = async (soldierId, newStatus) => {
            if (!currentUser) return;
            const dateStr = document.getElementById('date-picker').value;
            const docRef = doc(db, `daily_status/${dateStr}/statuses`, soldierId);
            
            try {
                await setDoc(docRef, { status: newStatus, updatedAt: new Date().toISOString() });
            } catch (error) {
                console.error("Error updating status:", error);
                showToast("שגיאה בעדכון סטטוס", true);
            }
        };

        window.openAddSoldierModal = () => {
            currentEditSoldierId = null;
            document.getElementById('modal-title').textContent = 'הוספת חייל למצבת';
            document.getElementById('modal-submit-btn').textContent = 'שמור חייל';
            document.getElementById('add-soldier-form').reset();
            
            document.getElementById('add-soldier-modal').classList.remove('hidden');
            document.getElementById('add-soldier-modal').classList.add('flex');
            document.getElementById('new-soldier-name').focus();
        };

        window.openEditSoldierModal = (id) => {
            const soldier = soldiers.find(s => s.id === id);
            if (!soldier) return;
            
            currentEditSoldierId = id;
            document.getElementById('modal-title').textContent = 'עריכת פרטי חייל';
            document.getElementById('modal-submit-btn').textContent = 'עדכן פרטים';
            
            document.getElementById('new-soldier-name').value = soldier.name || '';
            document.getElementById('new-soldier-id').value = soldier.personalId || '';
            document.getElementById('new-soldier-phone').value = soldier.phone || '';
            document.getElementById('new-soldier-role').value = soldier.role || '';
            document.getElementById('new-soldier-dept').value = soldier.department || '';
            
            document.getElementById('add-soldier-modal').classList.remove('hidden');
            document.getElementById('add-soldier-modal').classList.add('flex');
            document.getElementById('new-soldier-name').focus();
        };

        window.closeAddSoldierModal = () => {
            document.getElementById('add-soldier-modal').classList.add('hidden');
            document.getElementById('add-soldier-modal').classList.remove('flex');
            document.getElementById('add-soldier-form').reset();
            currentEditSoldierId = null;
        };

        window.submitSoldierForm = async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const name = document.getElementById('new-soldier-name').value.trim();
            const dept = document.getElementById('new-soldier-dept').value.trim();
            const personalId = document.getElementById('new-soldier-id').value.trim();
            const phone = document.getElementById('new-soldier-phone').value.trim();
            const role = document.getElementById('new-soldier-role').value.trim();

            if (!name || !dept) return;

            try {
                if (currentEditSoldierId) {
                    // Update existing soldier
                    await updateDoc(doc(db, 'soldiers_roster', currentEditSoldierId), {
                        name: name,
                        department: dept,
                        personalId: personalId,
                        phone: phone,
                        role: role
                    });
                    showToast(`פרטי החייל עודכנו בהצלחה`);
                } else {
                    // Add new soldier
                    await addDoc(collection(db, 'soldiers_roster'), {
                        name: name,
                        department: dept,
                        personalId: personalId,
                        phone: phone,
                        role: role,
                        createdAt: new Date().toISOString()
                    });
                    showToast(`החייל ${name} נוסף בהצלחה`);
                }
                
                closeAddSoldierModal();
                
                if (activeTab !== "הכל" && activeTab !== dept) {
                     activeTab = dept; 
                }
            } catch (error) {
                console.error("Error saving soldier:", error);
                showToast("שגיאה בשמירת נתונים", true);
            }
        };

        window.confirmDelete = (id) => {
            const soldier = soldiers.find(s => s.id === id);
            const name = soldier ? soldier.name : 'חייל זה';

            const confirmDiv = document.createElement('div');
            confirmDiv.id = 'confirm-modal';
            confirmDiv.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4';
            confirmDiv.innerHTML = `
                <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full text-center">
                    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500 text-2xl">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">מחיקת חייל</h3>
                    <p class="text-gray-600 mb-6">האם אתה בטוח שברצונך למחוק את <strong>${escapeHTML(name)}</strong> מהמצבת? לא ניתן לבטל פעולה זו.</p>
                    <div class="flex justify-center gap-3">
                        <button onclick="document.getElementById('confirm-modal').remove()" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition">ביטול</button>
                        <button onclick="executeDelete('${id}')" class="px-4 py-2 text-white bg-red-500 hover:bg-red-600 rounded-lg font-medium transition shadow-md">כן, מחק חייל</button>
                    </div>
                </div>
            `;
            document.body.appendChild(confirmDiv);
        };

        window.executeDelete = async (soldierId) => {
            if (!currentUser) return;
            const docRef = doc(db, 'soldiers_roster', soldierId);
            try {
                await deleteDoc(docRef);
                document.getElementById('confirm-modal').remove();
                showToast("החייל נמחק מהמצבת");
            } catch (error) {
                console.error("Error deleting:", error);
                showToast("שגיאה במחיקת החייל", true);
            }
        };

        window.confirmUndoImport = () => {
            const batchIds = soldiers.map(s => s.importId).filter(id => id);
            if (batchIds.length === 0) {
                showToast("לא נמצאו נתוני ייבוא שאפשר לבטל.", true);
                return;
            }
            const lastBatchId = Math.max(...batchIds);
            const soldiersToDelete = soldiers.filter(s => s.importId === lastBatchId);

            const confirmDiv = document.createElement('div');
            confirmDiv.id = 'confirm-undo-modal';
            confirmDiv.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4';
            confirmDiv.innerHTML = `
                <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full text-center">
                    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500 text-2xl">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">ביטול ייבוא אחרון</h3>
                    <p class="text-gray-600 mb-6">האם למחוק <strong>${soldiersToDelete.length}</strong> חיילים שהתווספו בייבוא האחרון?</p>
                    <div class="flex justify-center gap-3">
                        <button onclick="document.getElementById('confirm-undo-modal').remove()" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition">ביטול</button>
                        <button onclick="executeUndoImport(${lastBatchId})" class="px-4 py-2 text-white bg-red-500 hover:bg-red-600 rounded-lg font-medium transition shadow-md">כן, מחק ייבוא</button>
                    </div>
                </div>
            `;
            document.body.appendChild(confirmDiv);
        };

        window.executeUndoImport = async (batchId) => {
            if (!currentUser) return;
            document.getElementById('confirm-undo-modal').remove();
            
            const soldiersToDelete = soldiers.filter(s => s.importId === batchId);
            showToast("מוחק נתונים... אנא המתן");
            
            let deletedCount = 0;
            for (const s of soldiersToDelete) {
                try {
                    await deleteDoc(doc(db, 'soldiers_roster', s.id));
                    deletedCount++;
                } catch (err) {
                    console.error("Error deleting", err);
                }
            }
            showToast(`הייבוא האחרון בוטל (${deletedCount} שורות נמחקו).`);
        };

        // --- EXCEL & CSV IMPORT (FILE NAME AS DEPARTMENT) ---
        
        window.processExcel = async (event) => {
            if (!currentUser) {
                showToast("יש להתחבר תחילה למ מסד הנתונים.", true);
                return;
            }
            const file = event.target.files[0];
            if (!file) return;

            // מושך את שם הקובץ ללא הסיומת (.csv או .xlsx)
            const baseFileName = file.name.replace(/\.[^/.]+$/, "");
            
            // שואל את המשתמש ומציע את שם הקובץ כברירת מחדל
            const deptName = prompt("אנא אשר או ערוך את שם המחלקה עבור קובץ זה:", baseFileName);
            
            if (!deptName) {
                event.target.value = ''; // ביטול
                return;
            }

            showToast("קורא את הקובץ... אנא המתן.");
            const importId = Date.now();

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    let added = 0;
                    
                    // אנחנו קוראים רק את הלשונית הראשונה בקובץ, כי חילקת אותם לקבצים נפרדים
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});
                    
                    if (rows.length > 0) {
                        let nameIndex = -1, roleIndex = -1, idIndex = -1, phoneIndex = -1;
                        
                        // חיפוש כותרות
                        for (let i = 0; i < Math.min(rows.length, 30); i++) {
                            const cols = rows[i].map(c => String(c).replace(/["']/g, '').trim());
                            
                            let foundName = cols.findIndex(c => c === 'שם' || c === 'שם מלא' || c === 'שם החייל' || c === 'שם פרטי');
                            if (foundName === -1) {
                                foundName = cols.findIndex(c => c.includes('שם'));
                            }
                            
                            if (foundName !== -1) {
                                nameIndex = foundName;
                                roleIndex = cols.findIndex(c => c.includes('תפקיד') || c.includes('מחלקה'));
                                idIndex = cols.findIndex(c => c.includes('מספר אישי') || c.includes('מס"א') || c.includes('אישי'));
                                phoneIndex = cols.findIndex(c => c.includes('טלפון') || c.includes('נייד'));
                                break;
                            }
                        }

                        // גיבוי קשיח במידה ולא מצא כותרות
                        if (nameIndex === -1 && rows.length > 0) {
                            nameIndex = 0; // טור A
                            roleIndex = 1; // טור B
                            idIndex = 2;   // טור C
                            phoneIndex = 3; // טור D
                        }

                        // הוספת החיילים
                        for (let i = 0; i < rows.length; i++) {
                            const cols = rows[i];
                            if (cols.length <= nameIndex) continue;
                            
                            const nameRaw = cols[nameIndex];
                            if (!nameRaw) continue; 
                            
                            const name = String(nameRaw).replace(/["']/g, '').trim();
                            
                            // סינון שורות זבל
                            if (name === 'שם' || name === 'שם מלא' || name.includes('סה"כ') || name.includes('סהכ') || name === 'מפקדים' || name === 'נהגים' || name.includes('100%') || name.length < 2 || !isNaN(name)) {
                                continue;
                            }
                            
                            const role = roleIndex > -1 && cols[roleIndex] ? String(cols[roleIndex]).replace(/["']/g, '').trim() : "";
                            const personalId = idIndex > -1 && cols[idIndex] ? String(cols[idIndex]).replace(/["']/g, '').trim() : "";
                            const phone = phoneIndex > -1 && cols[phoneIndex] ? String(cols[phoneIndex]).replace(/["']/g, '').trim() : "";

                            try {
                                await addDoc(collection(db, 'soldiers_roster'), {
                                    name: name,
                                    department: deptName,
                                    role: role,
                                    personalId: personalId,
                                    phone: phone,
                                    createdAt: new Date().toISOString(),
                                    importId: importId
                                });
                                added++;
                            } catch (error) {
                                console.error("Error adding soldier:", error);
                            }
                        }
                    }
                    
                    if (added > 0) {
                        showToast(`הייבוא הסתיים! ${added} חיילים נוספו למחלקת ${deptName}.`);
                    } else {
                        showToast("לא נמצאו חיילים תקינים לייבוא בתוך הקובץ.", true);
                    }
                    
                } catch (err) {
                    console.error(err);
                    showToast("שגיאה בקריאת הקובץ. ודא שזה קובץ תקין.", true);
                }
                
                event.target.value = ''; // איפוס הקלט
            };
            
            reader.readAsArrayBuffer(file);
        };

        // --- END EXCEL IMPORT ---

        window.copySummary = () => {
            const date = document.getElementById('date-picker').value;
            const parts = date.split('-');
            const prettyDate = parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : date;
            
            let text = `*דוח 1 - ${prettyDate}*\n`;
            if (activeTab !== "הכל") text += `*מחלקה: ${activeTab}*\n`;
            text += `\n`;
            
            let counts = {};
            STATUS_OPTIONS.forEach(opt => counts[opt.val] = 0);
            let missingNames = [];

            // אנחנו מייצאים לוואטסאפ את כל המחלקה תמיד, ללא קשר לחיפוש הנוכחי.
            const filteredSoldiers = activeTab === "הכל" 
                ? soldiers 
                : soldiers.filter(s => s.department === activeTab);

            filteredSoldiers.forEach(s => {
                const stat = dailyStatusMap[s.id] || "לא דווח";
                if (counts[stat] !== undefined) {
                    counts[stat]++;
                } else {
                    counts["לא דווח"]++;
                }
                
                if (stat === "לא דווח") {
                    missingNames.push(s.name);
                }
            });

            text += `👥 סה"כ במצבת: ${filteredSoldiers.length}\n`;
            
            STATUS_OPTIONS.forEach(opt => {
                if (opt.val !== "לא דווח" && counts[opt.val] > 0) {
                    text += `${opt.emoji} ${opt.val}: ${counts[opt.val]}\n`;
                }
            });
            
            text += `\n${STATUS_OPTIONS[0].emoji} לא דווח: ${counts["לא דווח"]}\n`;
            if (missingNames.length > 0 && missingNames.length <= 15) {
                text += `(חסרים: ${missingNames.join(', ')})\n`;
            }

            copyToClipboard(text);
        };

        window.exportToCSV = () => {
            const date = document.getElementById('date-picker').value;
            
            const filteredSoldiers = activeTab === "הכל" 
                ? soldiers 
                : soldiers.filter(s => s.department === activeTab);

            let csvContent = "data:text/csv;charset=utf-8,%EF%BB%BF"; // BOM for Hebrew
            csvContent += "שם החייל,מספר אישי,טלפון,תפקיד,מחלקה,סטטוס ב-" + date + "\n";

            filteredSoldiers.forEach(s => {
                const stat = dailyStatusMap[s.id] || "לא דווח";
                csvContent += `"${s.name || ''}","${s.personalId || ''}","${s.phone || ''}","${s.role || ''}","${s.department || ''}","${stat}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `דוח_1_${activeTab}_${date}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("הדיווח הועתק ללוח. אפשר להדביק בוואטסאפ!");
            } catch (err) {
                console.error('Failed to copy', err);
                showToast("שגיאה בהעתקה", true);
            }
            document.body.removeChild(textarea);
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toast-msg');
            const icon = toast.querySelector('i');
            
            msgSpan.textContent = message;
            
            if (isError) {
                toast.classList.replace('bg-gray-800', 'bg-red-600');
                icon.className = 'fa-solid fa-circle-exclamation';
            } else {
                toast.classList.replace('bg-red-600', 'bg-gray-800');
                icon.className = 'fa-solid fa-circle-check text-green-400';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 3000);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag]));
        }

        // Boot
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
