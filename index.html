<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת דוח 1 - מפלג ואספקה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Heebo', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #a1a1aa; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #71717a; 
        }
        .tab-active {
            border-bottom-width: 4px;
            border-color: #15803d; /* Tailwind green-700 */
            color: #15803d;
            font-weight: 700;
        }
        .tab-inactive {
            color: #6b7280; /* Tailwind gray-500 */
            font-weight: 500;
        }
        .tab-inactive:hover {
            color: #374151; /* Tailwind gray-700 */
            border-bottom-width: 4px;
            border-color: #d1d5db;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- App Header -->
    <header class="bg-green-800 text-white shadow-md z-10 relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-clipboard-list text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">ניהול דוח 1 - מילואים</h1>
            </div>
            
            <div class="flex items-center gap-4 w-full sm:w-auto bg-green-900 px-4 py-2 rounded-lg">
                <label for="date-picker" class="font-medium text-sm whitespace-nowrap"><i class="fa-regular fa-calendar-days ml-1"></i> תאריך דיווח:</label>
                <input type="date" id="date-picker" class="bg-transparent border-b border-green-500 text-white focus:outline-none focus:border-white w-full sm:w-auto text-center" />
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                <button onclick="copySummary()" class="flex-1 sm:flex-none bg-green-600 hover:bg-green-500 transition px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap">
                    <i class="fa-brands fa-whatsapp ml-1"></i> העתק דיווח
                </button>
                <button onclick="exportToCSV()" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 transition px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap">
                    <i class="fa-solid fa-file-excel ml-1"></i> ייצוא לאקסל
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 py-6 w-full flex flex-col">
        
        <div class="bg-white shadow rounded-t-lg overflow-hidden border-b border-gray-200">
            <div class="flex overflow-x-auto no-scrollbar" id="tabs-container">
                <!-- Tabs will be injected here -->
                <div class="px-6 py-3 tab-active cursor-pointer whitespace-nowrap transition">כללי</div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="bg-white shadow rounded-b-lg flex-grow p-4 sm:p-6 overflow-hidden flex flex-col relative">
            
            <!-- Tools Row -->
            <div class="flex justify-between items-center mb-4 border-b pb-4">
                <h2 id="current-tab-title" class="text-xl font-bold text-gray-800">מעלים נתונים...</h2>
                <button onclick="openAddSoldierModal()" class="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded shadow transition text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i>
                    <span class="hidden sm:inline">הוסף חייל למצבת</span>
                </button>
            </div>

            <!-- Table Container -->
            <div class="overflow-x-auto flex-grow rounded-lg border border-gray-200">
                <table class="w-full text-right border-collapse">
                    <thead class="bg-gray-100 text-gray-700 text-sm border-b-2 border-gray-300">
                        <tr>
                            <th class="p-3 font-semibold w-12 text-center">#</th>
                            <th class="p-3 font-semibold">שם החייל</th>
                            <th class="p-3 font-semibold hidden sm:table-cell">מחלקה</th>
                            <th class="p-3 font-semibold w-48">סטטוס דוח 1</th>
                            <th class="p-3 font-semibold w-16 text-center">פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="soldiers-table-body" class="divide-y divide-gray-200 text-gray-800">
                        <!-- Rows injected here -->
                        <tr><td colspan="5" class="p-8 text-center text-gray-500">טוען נתונים מהשרת...</td></tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- Add Soldier Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="bg-gray-100 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-user-plus ml-2 text-green-700"></i>הוספת חייל למצבת הקבועה</h3>
                <button onclick="closeModal('add-modal')" class="text-gray-500 hover:text-red-500 transition"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">שם מלא</label>
                    <input type="text" id="new-soldier-name" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="לדוגמה: ישראל ישראלי">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">מחלקה / צוות</label>
                    <input type="text" id="new-soldier-dept" list="dept-list" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="בחר מרשימה או הקלד חדש (למשל: מפלג)">
                    <datalist id="dept-list">
                        <option value="מפלג"></option>
                        <option value="אספקה"></option>
                    </datalist>
                </div>
            </div>
            <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
                <button onclick="closeModal('add-modal')" class="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-100 transition">ביטול</button>
                <button onclick="saveNewSoldier()" class="px-4 py-2 bg-green-700 text-white rounded hover:bg-green-800 transition shadow">שמור במצבת</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-info"></i>
        <span id="toast-msg">הודעה</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, setDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        let db;
        let auth;
        let currentUser = null;
        let appId = typeof __app_id !== 'undefined' ? __app_id : 'default-doach1-app';
        
        let soldiers = []; // The static roster
        let dailyStatusMap = {}; // { soldierId: "status" } for the selected date
        let departments = new Set(["הכל", "מפלג", "אספקה"]);
        let activeTab = "הכל";
        
        // Unsubscribe functions for real-time listeners
        let unsubSoldiers = null;
        let unsubDaily = null;

        const STATUS_OPTIONS = [
            { val: "לא דווח", color: "text-gray-500 bg-gray-100" },
            { val: "בבסיס", color: "text-green-800 bg-green-100" },
            { val: "בחופשה", color: "text-blue-800 bg-blue-100" },
            { val: "השתחרר מהמילואים", color: "text-purple-800 bg-purple-100" },
            { val: "גימלים", color: "text-red-800 bg-red-100" }
        ];

        async function init() {
            try {
                // Initialize Firebase
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                    // Fallback dummy config for local testing if needed
                    projectId: "dummy-project"
                };
                
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Authenticate (Strictly following Rule 3)
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const userCredential = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = userCredential.user;
                } else {
                    const userCredential = await signInAnonymously(auth);
                    currentUser = userCredential.user;
                }

                if (!currentUser) throw new Error("Authentication failed");

                // Set today's date
                const dateInput = document.getElementById('date-picker');
                const today = new Date();
                // Format correctly to local timezone YYYY-MM-DD
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                dateInput.value = `${yyyy}-${mm}-${dd}`;
                
                dateInput.addEventListener('change', handleDateChange);

                // Start fetching data
                startDataListeners();

            } catch (err) {
                console.error("Initialization error:", err);
                showToast("שגיאה בהתחברות למסד הנתונים.", true);
            }
        }

        function startDataListeners() {
            if (!currentUser) return;

            // Paths based on Rule 1 (Public collaborative data)
            const soldiersRef = collection(db, 'artifacts', appId, 'public', 'data', 'soldiers');
            
            // Listen to Soldiers roster
            unsubSoldiers = onSnapshot(soldiersRef, (snapshot) => {
                soldiers = [];
                departments = new Set(["הכל"]); // Reset departments
                
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    soldiers.push({ id: docSnap.id, ...data });
                    if (data.department) departments.add(data.department);
                });

                // Sort soldiers by name
                soldiers.sort((a, b) => a.name.localeCompare(b.name, 'he'));
                
                updateTabsUI();
                renderTable();
            }, (error) => {
                console.error("Error fetching soldiers:", error);
                showToast("שגיאה בטעינת מצבת החיילים.", true);
            });

            // Initial fetch of daily statuses
            handleDateChange(); 
        }

        function handleDateChange() {
            const selectedDate = document.getElementById('date-picker').value;
            if (!selectedDate || !currentUser) return;

            // Unsubscribe from previous date if exists
            if (unsubDaily) unsubDaily();

            const dailyDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'daily_reports', selectedDate);
            
            unsubDaily = onSnapshot(dailyDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    dailyStatusMap = docSnap.data() || {};
                } else {
                    dailyStatusMap = {};
                }
                renderTable(); // Re-render to show statuses for the new date
            }, (error) => {
                console.error("Error fetching daily report:", error);
            });
        }

        // Expose to window so HTML can call it
        window.updateStatus = async function(soldierId, newStatus) {
            if (!currentUser) return;
            const selectedDate = document.getElementById('date-picker').value;
            if (!selectedDate) {
                showToast("אנא בחר תאריך תחילה.", true);
                return;
            }

            const dailyDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'daily_reports', selectedDate);
            
            // Optimistic UI Update
            dailyStatusMap[soldierId] = newStatus;
            
            // Update Select styling immediately
            const selectEl = document.getElementById(`status-${soldierId}`);
            if(selectEl) {
                applyStatusStyle(selectEl, newStatus);
            }

            try {
                // We use setDoc with merge: true to just update/add this soldier's status
                await setDoc(dailyDocRef, {
                    [soldierId]: newStatus,
                    updatedAt: new Date().toISOString(),
                    updatedBy: currentUser.uid
                }, { merge: true });
            } catch (error) {
                console.error("Error updating status:", error);
                showToast("שגיאה בעדכון הסטטוס.", true);
            }
        };

        function updateTabsUI() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = ''; // Clear

            departments.forEach(dept => {
                const tab = document.createElement('div');
                tab.className = `px-6 py-3 cursor-pointer whitespace-nowrap transition select-none ${activeTab === dept ? 'tab-active' : 'tab-inactive'}`;
                tab.textContent = dept;
                tab.onclick = () => {
                    activeTab = dept;
                    updateTabsUI();
                    renderTable();
                };
                container.appendChild(tab);
            });
            
            // Update datalist for Add Modal
            const datalist = document.getElementById('dept-list');
            datalist.innerHTML = '';
            departments.forEach(dept => {
                if(dept !== "הכל") {
                    const opt = document.createElement('option');
                    opt.value = dept;
                    datalist.appendChild(opt);
                }
            });
        }

        function renderTable() {
            document.getElementById('current-tab-title').textContent = activeTab === "הכל" ? "כל הכוח" : `מחלקה: ${activeTab}`;
            const tbody = document.getElementById('soldiers-table-body');
            tbody.innerHTML = '';

            let filteredSoldiers = soldiers;
            if (activeTab !== "הכל") {
                filteredSoldiers = soldiers.filter(s => s.department === activeTab);
            }

            if (filteredSoldiers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">אין חיילים במחלקה זו. הוסף חיילים למצבת.</td></tr>`;
                return;
            }

            filteredSoldiers.forEach((soldier, index) => {
                const currentStatus = dailyStatusMap[soldier.id] || "לא דווח";
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                
                // Construct Status Options HTML
                let optionsHTML = '';
                STATUS_OPTIONS.forEach(opt => {
                    const isSelected = currentStatus === opt.val ? 'selected' : '';
                    optionsHTML += `<option value="${opt.val}" ${isSelected}>${opt.val}</option>`;
                });

                tr.innerHTML = `
                    <td class="p-3 text-center text-gray-500">${index + 1}</td>
                    <td class="p-3 font-medium text-gray-900">${escapeHTML(soldier.name)}</td>
                    <td class="p-3 text-gray-600 hidden sm:table-cell">${escapeHTML(soldier.department || '-')}</td>
                    <td class="p-3">
                        <select 
                            id="status-${soldier.id}"
                            onchange="updateStatus('${soldier.id}', this.value)"
                            class="w-full border-0 outline-none rounded-md px-3 py-1.5 font-medium shadow-sm focus:ring-2 focus:ring-green-500 appearance-none text-center cursor-pointer transition-colors"
                        >
                            ${optionsHTML}
                        </select>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="confirmDelete('${soldier.id}', '${escapeHTML(soldier.name)}')" class="text-gray-400 hover:text-red-600 transition p-1" title="מחק חייל">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);

                // Apply initial style
                applyStatusStyle(document.getElementById(`status-${soldier.id}`), currentStatus);
            });
        }

        function applyStatusStyle(selectElement, statusValue) {
            // Remove existing custom classes
            STATUS_OPTIONS.forEach(opt => {
                const classes = opt.color.split(' ');
                selectElement.classList.remove(...classes);
            });
            // Add new class
            const matchedOpt = STATUS_OPTIONS.find(o => o.val === statusValue) || STATUS_OPTIONS[0];
            const newClasses = matchedOpt.color.split(' ');
            selectElement.classList.add(...newClasses);
        }

        window.openAddSoldierModal = () => {
            document.getElementById('new-soldier-name').value = '';
            // Auto-fill dept if a specific tab is selected
            document.getElementById('new-soldier-dept').value = activeTab === "הכל" ? '' : activeTab;
            document.getElementById('add-modal').classList.remove('hidden');
        };

        window.closeModal = (modalId) => {
            document.getElementById(modalId).classList.add('hidden');
        };

        window.saveNewSoldier = async () => {
            if (!currentUser) return;
            const name = document.getElementById('new-soldier-name').value.trim();
            const dept = document.getElementById('new-soldier-dept').value.trim();

            if (!name) {
                showToast("יש להזין שם חייל", true);
                return;
            }

            const soldiersRef = collection(db, 'artifacts', appId, 'public', 'data', 'soldiers');
            try {
                await addDoc(soldiersRef, {
                    name: name,
                    department: dept || 'כללי',
                    createdAt: new Date().toISOString()
                });
                closeModal('add-modal');
                showToast("החייל נוסף בהצלחה");
            } catch (error) {
                console.error("Error adding soldier:", error);
                showToast("שגיאה בהוספת החייל", true);
            }
        };

        window.confirmDelete = (soldierId, soldierName) => {
            // Using a custom modal approach or confirm (Wait, prompt says NO alert/confirm under any circumstances. I will use a custom implementation or soft delete).
            // Creating a dynamic confirmation modal:
            const existingModal = document.getElementById('confirm-modal');
            if(existingModal) existingModal.remove();

            const modalHtml = `
            <div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center p-4">
                <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden">
                    <div class="p-6 text-center">
                        <div class="text-red-500 mb-4"><i class="fa-solid fa-triangle-exclamation text-4xl"></i></div>
                        <h3 class="text-lg font-bold text-gray-800 mb-2">מחיקת חייל</h3>
                        <p class="text-gray-600 mb-6">האם אתה בטוח שברצונך למחוק את החייל <strong>${soldierName}</strong> מהמצבת?</p>
                        <div class="flex justify-center gap-3">
                            <button onclick="document.getElementById('confirm-modal').remove()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-100 transition">ביטול</button>
                            <button onclick="executeDelete('${soldierId}')" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition shadow">כן, מחק</button>
                        </div>
                    </div>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        };

        window.executeDelete = async (soldierId) => {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'soldiers', soldierId);
            try {
                await deleteDoc(docRef);
                document.getElementById('confirm-modal').remove();
                showToast("החייל נמחק מהמצבת");
            } catch (error) {
                console.error("Error deleting:", error);
                showToast("שגיאה במחיקת החייל", true);
            }
        };

        window.copySummary = () => {
            const date = document.getElementById('date-picker').value;
            // Reverse date format for Hebrew view DD/MM/YYYY
            const parts = date.split('-');
            const prettyDate = parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : date;
            
            let text = `*דוח 1 - ${prettyDate}*\n\n`;
            
            let counts = {};
            STATUS_OPTIONS.forEach(opt => counts[opt.val] = 0);
            
            let missingNames = [];

            soldiers.forEach(s => {
                const stat = dailyStatusMap[s.id] || "לא דווח";
                counts[stat]++;
                if (stat === "לא דווח") {
                    missingNames.push(s.name);
                }
            });

            text += `👥 סה"כ במצבת: ${soldiers.length}\n`;
            text += `🟢 בבסיס: ${counts["בבסיס"]}\n`;
            text += `🔵 בחופשה: ${counts["בחופשה"]}\n`;
            text += `🟣 שוחררו: ${counts["השתחרר מהמילואים"]}\n`;
            if(counts["גימלים"] > 0) text += `🔴 גימלים: ${counts["גימלים"]}\n`;
            
            text += `\n⚪ לא דווח: ${counts["לא דווח"]}\n`;
            if (missingNames.length > 0 && missingNames.length <= 10) {
                text += `(חסרים דיווח: ${missingNames.join(', ')})\n`;
            }

            copyToClipboard(text);
        };

        window.exportToCSV = () => {
            const date = document.getElementById('date-picker').value;
            // Add BOM for Hebrew support in Excel
            let csvContent = "\uFEFF";
            csvContent += "שם חייל,מחלקה/צוות,סטטוס דוח 1\n";
            
            soldiers.forEach(s => {
                const status = dailyStatusMap[s.id] || "לא דווח";
                // Escape quotes just in case
                const safeName = s.name.replace(/"/g, '""');
                const safeDept = (s.department || "").replace(/"/g, '""');
                csvContent += `"${safeName}","${safeDept}","${status}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `דוח_1_${date}.csv`);
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        function copyToClipboard(text) {
            // Using modern clipboard API with fallback
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("הסיכום הועתק ללוח!");
                }).catch(err => {
                    fallbackCopyTextToClipboard(text);
                });
            } else {
                fallbackCopyTextToClipboard(text);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            // Avoid scrolling to bottom
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("הסיכום הועתק ללוח!");
            } catch (err) {
                showToast("שגיאה בהעתקה", true);
            }
            document.body.removeChild(textArea);
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            msgEl.textContent = message;
            
            if(isError) {
                toast.classList.replace('bg-gray-800', 'bg-red-600');
            } else {
                toast.classList.replace('bg-red-600', 'bg-gray-800');
            }

            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 3000);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag]));
        }

        // Midnight Auto-refresh Function
        function setupMidnightRefresh() {
            const now = new Date();
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);
            const msUntilMidnight = tomorrow - now;
            
            setTimeout(() => {
                window.location.reload(); // Reload the page to load the new day automatically
            }, msUntilMidnight);
        }

        // CSV Import Logic
        window.processCSV = async (event) => {
            if (!currentUser) {
                showToast("יש להתחבר תחילה למסד הנתונים.", true);
                return;
            }
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const text = e.target.result;
                const lines = text.split('\n');
                let nameIndex = -1;
                let deptIndex = -1;
                
                // Scan the first few rows to find the headers "שם" and "תפקיד" (or "מחלקה")
                for (let i = 0; i < Math.min(lines.length, 30); i++) {
                    const cols = lines[i].split(',').map(c => c.trim().replace(/"/g, ''));
                    if (cols.includes('שם')) {
                        nameIndex = cols.indexOf('שם');
                        deptIndex = cols.includes('מחלקה') ? cols.indexOf('מחלקה') : cols.indexOf('תפקיד');
                        break;
                    }
                }

                if (nameIndex === -1) {
                    showToast("לא נמצאה עמודת 'שם' בקובץ ה-CSV. אנא ודא שהקובץ תקין.", true);
                    return;
                }

                showToast("מייבא נתונים מהקובץ... אנא המתן.");
                const soldiersRef = collection(db, 'artifacts', appId, 'public', 'data', 'soldiers');
                
                let added = 0;
                for (let i = 0; i < lines.length; i++) {
                    const cols = lines[i].split(',').map(c => c.trim().replace(/"/g, ''));
                    const name = cols[nameIndex];
                    
                    // Skip empty rows, headers, or summary rows
                    if (!name || name === 'שם' || name.includes('סה"כ')) continue;
                    
                    const dept = (deptIndex !== -1 && cols[deptIndex]) ? cols[deptIndex] : 'כללי';
                    
                    try {
                        await addDoc(soldiersRef, {
                            name: name,
                            department: dept,
                            createdAt: new Date().toISOString()
                        });
                        added++;
                    } catch (error) {
                        console.error("Error adding soldier row:", error);
                    }
                }
                
                showToast(`הייבוא הסתיים! ${added} חיילים נוספו למצבת.`);
                // Reset input so the same file can be selected again if needed
                event.target.value = '';
            };
            
            // Read as UTF-8 (If Excel CSV is in Hebrew, it is best saved as CSV UTF-8)
            reader.readAsText(file);
        };

        // Boot
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
